# Five-node Ironclad cluster.
#
#   docker compose up -d --build
#   ./target/release/ironclad-cli -a 127.0.0.1:6001,127.0.0.1:6002,127.0.0.1:6003,127.0.0.1:6004,127.0.0.1:6005 status
#
# Peers talk over the compose network (nodeN:7001). Client addresses are
# advertised as the host-mapped ports, so leader redirects work from the host.

x-node: &node
  build: .
  image: ironclad:latest
  restart: "no"
  environment:
    RUST_LOG: info

services:
  node1:
    <<: *node
    hostname: node1
    command: --id 1 --listen 0.0.0.0:6001 --peer-listen 0.0.0.0:7001 --member 1=127.0.0.1:6001=node1:7001 --member 2=127.0.0.1:6002=node2:7001 --member 3=127.0.0.1:6003=node3:7001 --member 4=127.0.0.1:6004=node4:7001 --member 5=127.0.0.1:6005=node5:7001
    ports:
      - "127.0.0.1:6001:6001"
    volumes:
      - node1:/data
  node2:
    <<: *node
    hostname: node2
    command: --id 2 --listen 0.0.0.0:6001 --peer-listen 0.0.0.0:7001 --member 1=127.0.0.1:6001=node1:7001 --member 2=127.0.0.1:6002=node2:7001 --member 3=127.0.0.1:6003=node3:7001 --member 4=127.0.0.1:6004=node4:7001 --member 5=127.0.0.1:6005=node5:7001
    ports:
      - "127.0.0.1:6002:6001"
    volumes:
      - node2:/data
  node3:
    <<: *node
    hostname: node3
    command: --id 3 --listen 0.0.0.0:6001 --peer-listen 0.0.0.0:7001 --member 1=127.0.0.1:6001=node1:7001 --member 2=127.0.0.1:6002=node2:7001 --member 3=127.0.0.1:6003=node3:7001 --member 4=127.0.0.1:6004=node4:7001 --member 5=127.0.0.1:6005=node5:7001
    ports:
      - "127.0.0.1:6003:6001"
    volumes:
      - node3:/data
  node4:
    <<: *node
    hostname: node4
    command: --id 4 --listen 0.0.0.0:6001 --peer-listen 0.0.0.0:7001 --member 1=127.0.0.1:6001=node1:7001 --member 2=127.0.0.1:6002=node2:7001 --member 3=127.0.0.1:6003=node3:7001 --member 4=127.0.0.1:6004=node4:7001 --member 5=127.0.0.1:6005=node5:7001
    ports:
      - "127.0.0.1:6004:6001"
    volumes:
      - node4:/data
  node5:
    <<: *node
    hostname: node5
    command: --id 5 --listen 0.0.0.0:6001 --peer-listen 0.0.0.0:7001 --member 1=127.0.0.1:6001=node1:7001 --member 2=127.0.0.1:6002=node2:7001 --member 3=127.0.0.1:6003=node3:7001 --member 4=127.0.0.1:6004=node4:7001 --member 5=127.0.0.1:6005=node5:7001
    ports:
      - "127.0.0.1:6005:6001"
    volumes:
      - node5:/data

volumes:
  node1:
  node2:
  node3:
  node4:
  node5:
