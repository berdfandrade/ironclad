[package]
name = "ironclad"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

# Tests run real fsync-heavy workloads; a little optimization keeps the
# suite fast without hurting debuggability much.
[profile.test]
opt-level = 1

[profile.release]
debug = 1

[[bench]]
name = "storage"
harness = false
