# Builds the .deb and the snap for every version tag (v*) and attaches them to
# a GitHub release. The snap is also published to the Snap Store when the
# SNAPCRAFT_STORE_CREDENTIALS secret exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deb:
    # Oldest supported runner: the .deb then installs on Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb --locked
      - run: cargo deb --output dist/
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
      # A stable name for "latest" download links, next to the versioned file.
      - run: cp dist/ironclad_*_amd64.deb dist/ironclad_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
      - name: Publish to the Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  release:
    needs: [deb, snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Ironclad $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/* --clobber
